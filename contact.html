<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Simple Static Website</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="brand">My Simple Site</div>
      <nav class="site-nav" id="siteNav">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="services.html">Services</a>
        <a href="portfolio.html">Portfolio</a>
        <a href="contact.html" class="active">Contact</a>
      </nav>
      <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation">☰</button>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">🌙</button>
    </div>
  </header>

  <main class="container main-content">
    <h1>Contact</h1>
    <p>Send a message through the form below. Your message is captured locally by the JavaScript file.</p>

    <form class="contact-form" id="contactForm">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" placeholder="Your name" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required>

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5" placeholder="Write your message here" required></textarea>

      <button type="submit" class="button">Send Message</button>
      <p class="form-feedback" id="formFeedback"></p>
    </form>

    <section class="saved-messages" id="savedMessages"></section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 Simple Static Website. Built with HTML, CSS, and JavaScript.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
